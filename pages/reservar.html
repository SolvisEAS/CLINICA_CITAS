<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reservar turno — Clínica</title>
<style>
  :root {
    --primary: #2f6690;
    --primary-dark: #204a6e;
    --bg: #f4f6f8;
    --card-bg: #ffffff;
    --border: #dde3e8;
    --text: #223;
    --text-muted: #667;
    --success: #2e7d32;
    --success-bg: #e8f5e9;
    --error: #c62828;
    --error-bg: #fdecea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--primary);
    color: white;
    padding: 18px 20px;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  header p { margin: 4px 0 0; font-size: 13px; opacity: 0.85; }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 24px 16px 60px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .card h2 { font-size: 16px; margin: 0 0 16px; color: var(--primary-dark); }
  label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 4px; margin-top: 12px; }
  label:first-of-type { margin-top: 0; }
  input, select, textarea {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
  }
  textarea { resize: vertical; min-height: 50px; }
  button.primary {
    background: var(--primary);
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    margin-top: 16px;
  }
  button.primary:hover { background: var(--primary-dark); }
  button.primary:disabled { opacity: 0.6; cursor: default; }
  .msg {
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 13px;
    margin-top: 14px;
    display: none;
  }
  .msg.error { background: var(--error-bg); color: var(--error); display: block; }
  .msg.success { background: var(--success-bg); color: var(--success); display: block; }
  .slots { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .slot-btn {
    padding: 8px 12px;
    border: 1px solid var(--primary);
    color: var(--primary);
    background: white;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  .slot-btn:hover { background: var(--primary); color: white; }
  .slot-btn.selected { background: var(--primary); color: white; }
  .appt {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .appt .info { font-size: 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .appt .info .doc { font-weight: 600; }
  .appt .info .when { color: var(--text-muted); font-size: 13px; }
  .appt .actions { display: flex; gap: 8px; margin-top: 10px; }
  .badge {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 12px;
    font-weight: 600;
    white-space: nowrap;
  }
  .badge.CONFIRMADA { background: #e3f2fd; color: #1565c0; }
  .badge.CANCELADA { background: #fdecea; color: #c62828; }
  .badge.ATENDIDA { background: #e8f5e9; color: #2e7d32; }
  .badge.NO_ASISTIO { background: #fff3e0; color: #e65100; }
  button.secondary {
    background: none;
    border: 1px solid var(--primary);
    color: var(--primary);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
  }
  button.secondary:hover { background: #eef4f8; }
  button.cancel-btn {
    background: none;
    border: 1px solid var(--error);
    color: var(--error);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
  }
  button.cancel-btn:hover { background: var(--error-bg); }
  .empty { color: var(--text-muted); font-size: 13px; text-align: center; padding: 10px 0; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tabs button {
    flex: 1;
    padding: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    color: var(--text-muted);
  }
  .tabs button.active { background: var(--primary); color: white; border-color: var(--primary); }
  .hint { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  .spinner-text { font-size: 13px; color: var(--text-muted); margin-top: 10px; }
</style>
</head>
<body>

<header>
  <h1>🦷 Clínica — Turnos</h1>
  <p>No hace falta crear una cuenta: alcanza con tu número de documento.</p>
</header>

<main>

  <div class="tabs">
    <button id="tab-reservar" class="active" onclick="showTab('reservar')">Reservar un turno</button>
    <button id="tab-consultar" onclick="showTab('consultar')">Consultar / cancelar mi turno</button>
  </div>

  <!-- ===================== RESERVAR ===================== -->
  <div id="panel-reservar">
    <div class="card">
      <h2>Tus datos</h2>
      <label>Número de documento (sin puntos ni comas)</label>
      <input type="text" id="doc-number" inputmode="numeric" placeholder="Ej: 12345678">
      <label>Nombre y apellido</label>
      <input type="text" id="doc-name">
      <label>Teléfono</label>
      <input type="text" id="doc-phone">
      <label>Correo electrónico</label>
      <input type="email" id="doc-email">
    </div>

    <div class="card">
      <h2>Elegí doctor, fecha y horario</h2>
      <label>Doctor</label>
      <select id="doctor-select"></select>
      <label>Fecha</label>
      <input type="date" id="date-input">
      <button class="primary" onclick="buscarHorarios()">Ver horarios disponibles</button>
      <div class="hint">Solo se permite un turno por día por paciente.</div>
      <div id="slots-container"></div>
      <div class="msg" id="booking-msg"></div>
    </div>
  </div>

  <!-- ===================== CONSULTAR ===================== -->
  <div id="panel-consultar" style="display:none;">
    <div class="card">
      <h2>Buscar mis turnos</h2>
      <label>Número de documento (sin puntos ni comas)</label>
      <input type="text" id="lookup-doc" inputmode="numeric" placeholder="Ej: 12345678">
      <button class="primary" onclick="buscarMisTurnos()">Buscar</button>
      <div class="msg" id="lookup-msg"></div>
    </div>
    <div class="card" id="mis-turnos-card" style="display:none;">
      <h2>Tus turnos</h2>
      <div id="appointments-list"></div>
    </div>
  </div>

</main>

<script>
const API = window.location.origin + "/api";
let doctors = [];
let selectedSlot = null;

function showTab(tab) {
  document.getElementById("tab-reservar").classList.toggle("active", tab === "reservar");
  document.getElementById("tab-consultar").classList.toggle("active", tab === "consultar");
  document.getElementById("panel-reservar").style.display = tab === "reservar" ? "block" : "none";
  document.getElementById("panel-consultar").style.display = tab === "consultar" ? "block" : "none";
}

function showMsg(elId, text, isError) {
  const el = document.getElementById(elId);
  el.textContent = text;
  el.className = "msg " + (isError ? "error" : "success");
}

function clearMsg(elId) {
  const el = document.getElementById(elId);
  el.textContent = "";
  el.className = "msg";
}

async function apiCall(method, path, body) {
  const headers = { "Content-Type": "application/json" };
  const resp = await fetch(API + path, {
    method,
    headers,
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  let data = null;
  try { data = await resp.json(); } catch (e) { /* sin cuerpo */ }
  return { status: resp.status, data };
}

function extractError(data) {
  if (!data) return "Ocurrió un error inesperado.";
  const firstKey = Object.keys(data)[0];
  const val = data[firstKey];
  if (Array.isArray(val)) return val[0];
  if (typeof val === "string") return val;
  return "Ocurrió un error inesperado.";
}

async function cargarDoctores() {
  const { status, data } = await apiCall("GET", "/doctors/");
  const select = document.getElementById("doctor-select");
  select.innerHTML = "";
  if (status !== 200) return;
  doctors = data.results || data;
  doctors.forEach(d => {
    const opt = document.createElement("option");
    opt.value = d.id;
    opt.textContent = (d.full_name || ("Doctor #" + d.id)) + " — " + (d.specialty || "");
    select.appendChild(opt);
  });
}

async function buscarHorarios() {
  clearMsg("booking-msg");
  selectedSlot = null;
  const container = document.getElementById("slots-container");
  container.innerHTML = '<div class="spinner-text">Buscando...</div>';
  const doctorId = document.getElementById("doctor-select").value;
  const date = document.getElementById("date-input").value;
  if (!doctorId || !date) {
    container.innerHTML = "";
    showMsg("booking-msg", "Elegí un doctor y una fecha.", true);
    return;
  }
  const { status, data } = await apiCall("GET", `/doctors/${doctorId}/availability/?date=${date}`);
  if (status !== 200) {
    container.innerHTML = "";
    showMsg("booking-msg", extractError(data), true);
    return;
  }
  if (!data.length) {
    container.innerHTML = '<div class="empty">No hay horarios libres ese día. Probá otra fecha.</div>';
    return;
  }
  container.innerHTML = "";
  const slotsDiv = document.createElement("div");
  slotsDiv.className = "slots";
  data.forEach(slot => {
    const btn = document.createElement("button");
    btn.className = "slot-btn";
    const hora = new Date(slot.start_datetime).toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" });
    btn.textContent = hora;
    btn.onclick = () => {
      document.querySelectorAll(".slot-btn").forEach(b => b.classList.remove("selected"));
      btn.classList.add("selected");
      selectedSlot = slot;
      mostrarConfirmacion(doctorId);
    };
    slotsDiv.appendChild(btn);
  });
  container.appendChild(slotsDiv);
}

function mostrarConfirmacion(doctorId) {
  let confirmDiv = document.getElementById("confirm-div");
  if (confirmDiv) confirmDiv.remove();
  confirmDiv = document.createElement("div");
  confirmDiv.id = "confirm-div";
  confirmDiv.innerHTML = `
    <label>Notas (opcional)</label>
    <textarea id="booking-notes" placeholder="Ej: primera consulta"></textarea>
    <button class="primary" id="confirm-btn">Confirmar reserva</button>
  `;
  document.getElementById("slots-container").appendChild(confirmDiv);
  document.getElementById("confirm-btn").onclick = () => confirmarReserva(doctorId);
}

async function confirmarReserva(doctorId) {
  clearMsg("booking-msg");
  const notes = document.getElementById("booking-notes")?.value || "";
  const body = {
    document_number: document.getElementById("doc-number").value.trim(),
    name: document.getElementById("doc-name").value.trim(),
    phone: document.getElementById("doc-phone").value.trim(),
    email: document.getElementById("doc-email").value.trim(),
    doctor: doctorId,
    start_datetime: selectedSlot.start_datetime,
    notes,
  };
  if (!body.document_number || !body.name || !body.phone || !body.email) {
    showMsg("booking-msg", "Completá tu documento, nombre, teléfono y correo antes de confirmar.", true);
    return;
  }
  const { status, data } = await apiCall("POST", "/appointments/", body);
  if (status === 201) {
    showMsg("booking-msg", "¡Turno reservado y confirmado! Guardá tu número de documento para consultarlo después.", false);
    document.getElementById("slots-container").innerHTML = "";
    selectedSlot = null;
  } else {
    showMsg("booking-msg", extractError(data), true);
  }
}

async function buscarMisTurnos() {
  clearMsg("lookup-msg");
  const doc = document.getElementById("lookup-doc").value.trim();
  const card = document.getElementById("mis-turnos-card");
  if (!doc) {
    showMsg("lookup-msg", "Ingresá tu número de documento.", true);
    card.style.display = "none";
    return;
  }
  const { status, data } = await apiCall("GET", `/patients/${encodeURIComponent(doc)}/appointments/`);
  if (status === 404) {
    showMsg("lookup-msg", "No encontramos ningún paciente con ese número de documento.", true);
    card.style.display = "none";
    return;
  }
  if (status !== 200) {
    showMsg("lookup-msg", extractError(data), true);
    card.style.display = "none";
    return;
  }
  const citas = data.results || data;
  card.style.display = "block";
  const container = document.getElementById("appointments-list");
  if (!citas.length) {
    container.innerHTML = '<div class="empty">Todavía no tenés turnos.</div>';
    return;
  }
  container.innerHTML = "";
  citas.forEach(c => {
    const fecha = new Date(c.start_datetime);
    const fechaStr = fecha.toLocaleDateString("es-AR");
    const horaStr = fecha.toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" });
    const puedeGestionar = c.status === "CONFIRMADA" && fecha > new Date();
    const div = document.createElement("div");
    div.className = "appt";
    div.innerHTML = `
      <div class="info">
        <div>
          <div class="doc">${c.doctor_name}</div>
          <div class="when">${fechaStr} · ${horaStr}</div>
        </div>
        <span class="badge ${c.status}">${c.status}</span>
      </div>
      ${puedeGestionar ? `
        <div class="actions">
          <button class="secondary" data-id="${c.id}" data-action="edit">Reprogramar</button>
          <button class="cancel-btn" data-id="${c.id}" data-action="cancel">Cancelar</button>
        </div>
      ` : ""}
    `;
    container.appendChild(div);
  });
  container.querySelectorAll("[data-action='cancel']").forEach(btn => {
    btn.onclick = () => cancelarTurno(doc, btn.dataset.id);
  });
  container.querySelectorAll("[data-action='edit']").forEach(btn => {
    btn.onclick = () => reprogramarTurno(doc, btn.dataset.id);
  });
}

async function cancelarTurno(doc, id) {
  if (!confirm("¿Seguro que querés cancelar este turno?")) return;
  const { status, data } = await apiCall("PATCH", `/patients/${encodeURIComponent(doc)}/appointments/${id}/cancel/`, {});
  if (status === 200) {
    await buscarMisTurnos();
  } else {
    alert(extractError(data));
  }
}

async function reprogramarTurno(doc, id) {
  const nuevaFechaHora = prompt("Nueva fecha y hora (formato AAAA-MM-DDTHH:MM), por ejemplo 2026-10-05T09:00:");
  if (!nuevaFechaHora) return;
  const { status, data } = await apiCall(
    "PATCH", `/patients/${encodeURIComponent(doc)}/appointments/${id}/`, { start_datetime: nuevaFechaHora }
  );
  if (status === 200) {
    await buscarMisTurnos();
  } else {
    alert(extractError(data));
  }
}

(async function init() {
  const today = new Date().toISOString().slice(0, 10);
  document.getElementById("date-input").min = today;
  document.getElementById("date-input").value = today;
  await cargarDoctores();
})();
</script>

</body>
</html>
