<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reservar turno — Clínica</title>
<style>
  :root {
    --primary: #2f6690;
    --primary-dark: #204a6e;
    --bg: #f4f6f8;
    --card-bg: #ffffff;
    --border: #dde3e8;
    --text: #223;
    --text-muted: #667;
    --success: #2e7d32;
    --success-bg: #e8f5e9;
    --error: #c62828;
    --error-bg: #fdecea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--primary);
    color: white;
    padding: 18px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  header .userbar { display: flex; align-items: center; gap: 12px; font-size: 14px; }
  header button.logout {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.4);
    color: white;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  header button.logout:hover { background: rgba(255,255,255,0.28); }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 24px 16px 60px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .card h2 { font-size: 16px; margin: 0 0 16px; color: var(--primary-dark); }
  label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 4px; margin-top: 12px; }
  label:first-of-type { margin-top: 0; }
  input, select, textarea {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
  }
  textarea { resize: vertical; min-height: 50px; }
  button.primary {
    background: var(--primary);
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    margin-top: 16px;
  }
  button.primary:hover { background: var(--primary-dark); }
  button.primary:disabled { opacity: 0.6; cursor: default; }
  button.link {
    background: none;
    border: none;
    color: var(--primary);
    cursor: pointer;
    font-size: 13px;
    text-decoration: underline;
    padding: 0;
  }
  .msg {
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 13px;
    margin-top: 14px;
    display: none;
  }
  .msg.error { background: var(--error-bg); color: var(--error); display: block; }
  .msg.success { background: var(--success-bg); color: var(--success); display: block; }
  .slots { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .slot-btn {
    padding: 8px 12px;
    border: 1px solid var(--primary);
    color: var(--primary);
    background: white;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  .slot-btn:hover { background: var(--primary); color: white; }
  .slot-btn.selected { background: var(--primary); color: white; }
  .appt {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .appt .info { font-size: 14px; }
  .appt .info .doc { font-weight: 600; }
  .appt .info .when { color: var(--text-muted); font-size: 13px; }
  .badge {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 12px;
    font-weight: 600;
    white-space: nowrap;
  }
  .badge.CONFIRMADA { background: #e3f2fd; color: #1565c0; }
  .badge.CANCELADA { background: #fdecea; color: #c62828; }
  .badge.ATENDIDA { background: #e8f5e9; color: #2e7d32; }
  .badge.NO_ASISTIO { background: #fff3e0; color: #e65100; }
  button.cancel-btn {
    background: none;
    border: 1px solid var(--error);
    color: var(--error);
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
  }
  button.cancel-btn:hover { background: var(--error-bg); }
  .empty { color: var(--text-muted); font-size: 13px; text-align: center; padding: 10px 0; }
  .auth-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .auth-tabs button {
    flex: 1;
    padding: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    color: var(--text-muted);
  }
  .auth-tabs button.active { background: var(--primary); color: white; border-color: var(--primary); }
  #app-section { display: none; }
  .spinner-text { font-size: 13px; color: var(--text-muted); margin-top: 10px; }
</style>
</head>
<body>

<header>
  <h1>🦷 Reservar turno</h1>
  <div class="userbar" id="userbar" style="display:none;">
    <span id="user-greeting"></span>
    <button class="logout" onclick="logout()">Cerrar sesión</button>
  </div>
</header>

<main>

  <!-- ===================== AUTENTICACIÓN ===================== -->
  <div id="auth-section">
    <div class="card">
      <div class="auth-tabs">
        <button id="tab-login" class="active" onclick="showTab('login')">Iniciar sesión</button>
        <button id="tab-register" onclick="showTab('register')">Registrarme</button>
      </div>

      <div id="login-form">
        <label>Usuario</label>
        <input type="text" id="login-username" autocomplete="username">
        <label>Contraseña</label>
        <input type="password" id="login-password" autocomplete="current-password">
        <button class="primary" onclick="login()">Iniciar sesión</button>
        <div class="msg" id="login-msg"></div>
      </div>

      <div id="register-form" style="display:none;">
        <label>Nombre</label>
        <input type="text" id="reg-first-name">
        <label>Apellido</label>
        <input type="text" id="reg-last-name">
        <label>Usuario</label>
        <input type="text" id="reg-username">
        <label>Email</label>
        <input type="email" id="reg-email">
        <label>Teléfono</label>
        <input type="text" id="reg-phone">
        <label>Contraseña</label>
        <input type="password" id="reg-password">
        <button class="primary" onclick="register()">Crear mi cuenta</button>
        <div class="msg" id="register-msg"></div>
      </div>
    </div>
  </div>

  <!-- ===================== APP (logueado) ===================== -->
  <div id="app-section">

    <div class="card">
      <h2>Reservar un turno</h2>
      <label>Doctor</label>
      <select id="doctor-select"></select>
      <label>Fecha</label>
      <input type="date" id="date-input">
      <button class="primary" onclick="buscarHorarios()">Ver horarios disponibles</button>
      <div id="slots-container"></div>
      <div class="msg" id="booking-msg"></div>
    </div>

    <div class="card">
      <h2>Mis citas</h2>
      <div id="appointments-list"><div class="empty">Cargando...</div></div>
    </div>

  </div>

</main>

<script>
const API = window.location.origin + "/api";
let accessToken = localStorage.getItem("clinica_access") || null;
let doctors = [];
let selectedSlot = null;
let selectedDoctorId = null;

function showTab(tab) {
  document.getElementById("tab-login").classList.toggle("active", tab === "login");
  document.getElementById("tab-register").classList.toggle("active", tab === "register");
  document.getElementById("login-form").style.display = tab === "login" ? "block" : "none";
  document.getElementById("register-form").style.display = tab === "register" ? "block" : "none";
}

function showMsg(elId, text, isError) {
  const el = document.getElementById(elId);
  el.textContent = text;
  el.className = "msg " + (isError ? "error" : "success");
}

function clearMsg(elId) {
  const el = document.getElementById(elId);
  el.textContent = "";
  el.className = "msg";
}

async function apiCall(method, path, body, auth) {
  const headers = { "Content-Type": "application/json" };
  if (auth && accessToken) headers["Authorization"] = "Bearer " + accessToken;
  const resp = await fetch(API + path, {
    method,
    headers,
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  let data = null;
  try { data = await resp.json(); } catch (e) { /* sin cuerpo */ }
  return { status: resp.status, data };
}

async function register() {
  clearMsg("register-msg");
  const body = {
    username: document.getElementById("reg-username").value.trim(),
    email: document.getElementById("reg-email").value.trim(),
    password: document.getElementById("reg-password").value,
    first_name: document.getElementById("reg-first-name").value.trim(),
    last_name: document.getElementById("reg-last-name").value.trim(),
    phone: document.getElementById("reg-phone").value.trim(),
  };
  const { status, data } = await apiCall("POST", "/users/register/", body, false);
  if (status === 201) {
    showMsg("register-msg", "¡Cuenta creada! Ahora iniciá sesión con tu usuario y contraseña.", false);
    document.getElementById("login-username").value = body.username;
    setTimeout(() => showTab("login"), 1200);
  } else {
    showMsg("register-msg", extractError(data), true);
  }
}

async function login() {
  clearMsg("login-msg");
  const username = document.getElementById("login-username").value.trim();
  const password = document.getElementById("login-password").value;
  const { status, data } = await apiCall("POST", "/auth/login/", { username, password }, false);
  if (status === 200) {
    accessToken = data.access;
    localStorage.setItem("clinica_access", accessToken);
    localStorage.setItem("clinica_refresh", data.refresh);
    await enterApp();
  } else {
    showMsg("login-msg", "Usuario o contraseña incorrectos.", true);
  }
}

function logout() {
  accessToken = null;
  localStorage.removeItem("clinica_access");
  localStorage.removeItem("clinica_refresh");
  document.getElementById("app-section").style.display = "none";
  document.getElementById("userbar").style.display = "none";
  document.getElementById("auth-section").style.display = "block";
  document.getElementById("login-password").value = "";
}

function extractError(data) {
  if (!data) return "Ocurrió un error inesperado.";
  const firstKey = Object.keys(data)[0];
  const val = data[firstKey];
  if (Array.isArray(val)) return val[0];
  if (typeof val === "string") return val;
  return "Ocurrió un error inesperado.";
}

async function enterApp() {
  const me = await apiCall("GET", "/users/me/", undefined, true);
  if (me.status !== 200) { logout(); return; }
  document.getElementById("auth-section").style.display = "none";
  document.getElementById("app-section").style.display = "block";
  document.getElementById("userbar").style.display = "flex";
  document.getElementById("user-greeting").textContent =
    "Hola, " + (me.data.first_name || me.data.username);

  const today = new Date().toISOString().slice(0, 10);
  document.getElementById("date-input").min = today;
  document.getElementById("date-input").value = today;

  await cargarDoctores();
  await cargarMisCitas();
}

async function cargarDoctores() {
  const { status, data } = await apiCall("GET", "/doctors/", undefined, true);
  const select = document.getElementById("doctor-select");
  select.innerHTML = "";
  if (status !== 200) return;
  doctors = data.results || data;
  doctors.forEach(d => {
    const opt = document.createElement("option");
    opt.value = d.id;
    opt.textContent = (d.full_name || ("Doctor #" + d.id)) + " — " + (d.specialty || "");
    select.appendChild(opt);
  });
  if (doctors.length) selectedDoctorId = doctors[0].id;
  select.onchange = () => { selectedDoctorId = select.value; };
}

async function buscarHorarios() {
  clearMsg("booking-msg");
  selectedSlot = null;
  const container = document.getElementById("slots-container");
  container.innerHTML = '<div class="spinner-text">Buscando...</div>';
  const doctorId = document.getElementById("doctor-select").value;
  const date = document.getElementById("date-input").value;
  if (!doctorId || !date) {
    container.innerHTML = "";
    showMsg("booking-msg", "Elegí un doctor y una fecha.", true);
    return;
  }
  const { status, data } = await apiCall(
    "GET", `/doctors/${doctorId}/availability/?date=${date}`, undefined, true
  );
  if (status !== 200) {
    container.innerHTML = "";
    showMsg("booking-msg", extractError(data), true);
    return;
  }
  if (!data.length) {
    container.innerHTML = '<div class="empty">No hay horarios libres ese día. Probá otra fecha.</div>';
    return;
  }
  container.innerHTML = "";
  const slotsDiv = document.createElement("div");
  slotsDiv.className = "slots";
  data.forEach(slot => {
    const btn = document.createElement("button");
    btn.className = "slot-btn";
    const hora = new Date(slot.start_datetime).toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" });
    btn.textContent = hora;
    btn.onclick = () => {
      document.querySelectorAll(".slot-btn").forEach(b => b.classList.remove("selected"));
      btn.classList.add("selected");
      selectedSlot = slot;
      mostrarConfirmacion(doctorId);
    };
    slotsDiv.appendChild(btn);
  });
  container.appendChild(slotsDiv);
}

function mostrarConfirmacion(doctorId) {
  let confirmDiv = document.getElementById("confirm-div");
  if (confirmDiv) confirmDiv.remove();
  confirmDiv = document.createElement("div");
  confirmDiv.id = "confirm-div";
  confirmDiv.innerHTML = `
    <label>Notas (opcional)</label>
    <textarea id="booking-notes" placeholder="Ej: primera consulta"></textarea>
    <button class="primary" id="confirm-btn">Confirmar reserva</button>
  `;
  document.getElementById("slots-container").appendChild(confirmDiv);
  document.getElementById("confirm-btn").onclick = () => confirmarReserva(doctorId);
}

async function confirmarReserva(doctorId) {
  clearMsg("booking-msg");
  const notes = document.getElementById("booking-notes")?.value || "";
  const { status, data } = await apiCall("POST", "/appointments/", {
    doctor: doctorId,
    start_datetime: selectedSlot.start_datetime,
    notes,
  }, true);
  if (status === 201) {
    showMsg("booking-msg", "¡Turno reservado y confirmado!", false);
    document.getElementById("slots-container").innerHTML = "";
    selectedSlot = null;
    await cargarMisCitas();
  } else {
    showMsg("booking-msg", extractError(data), true);
  }
}

async function cargarMisCitas() {
  const container = document.getElementById("appointments-list");
  const { status, data } = await apiCall("GET", "/appointments/mine/", undefined, true);
  if (status !== 200) {
    container.innerHTML = '<div class="empty">No se pudieron cargar tus citas.</div>';
    return;
  }
  const citas = data.results || data;
  if (!citas.length) {
    container.innerHTML = '<div class="empty">Todavía no tenés citas reservadas.</div>';
    return;
  }
  container.innerHTML = "";
  citas.forEach(c => {
    const fecha = new Date(c.start_datetime);
    const fechaStr = fecha.toLocaleDateString("es-AR");
    const horaStr = fecha.toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" });
    const div = document.createElement("div");
    div.className = "appt";
    const puedeCancelar = c.status === "CONFIRMADA" && fecha > new Date();
    div.innerHTML = `
      <div class="info">
        <div class="doc">${c.doctor_name}</div>
        <div class="when">${fechaStr} · ${horaStr}</div>
      </div>
      <div style="display:flex; align-items:center; gap:8px;">
        <span class="badge ${c.status}">${c.status}</span>
        ${puedeCancelar ? `<button class="cancel-btn" data-id="${c.id}">Cancelar</button>` : ""}
      </div>
    `;
    container.appendChild(div);
  });
  container.querySelectorAll(".cancel-btn").forEach(btn => {
    btn.onclick = () => cancelarCita(btn.dataset.id);
  });
}

async function cancelarCita(id) {
  if (!confirm("¿Seguro que querés cancelar esta cita?")) return;
  const { status, data } = await apiCall("PATCH", `/appointments/${id}/cancel/`, {}, true);
  if (status === 200) {
    await cargarMisCitas();
  } else {
    alert(extractError(data));
  }
}

// Al cargar la página: si ya había un token guardado, entrar directo.
(async function init() {
  if (accessToken) {
    await enterApp();
  }
})();
</script>

</body>
</html>
